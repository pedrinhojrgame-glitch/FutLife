const clubShield=(name,size=34)=>{const v=clubLook(name);return v.shield?`<img class="club-shield" src="${v.shield}" width="${size}" height="${Math.round(size*1.17)}" alt="Escudo de ${esc(name)}" loading="lazy">`:''};

function shopArt(id,cat){
 if(SHOP_REAL_ART[id])return `<img class="product-art-image" src="${SHOP_REAL_ART[id]}" alt="${esc(cat)}" loading="lazy">`;
 if(SHOP_BOOT_ART[id])return `<img class="product-art-image" src="${SHOP_BOOT_ART[id]}" alt="Chuteira de futebol com travas" loading="lazy">`;
 const code=[...id].reduce((n,ch)=>((n*31+ch.charCodeAt(0))>>>0),7);
 const hue=code%360,alt=(hue+105)%360,accent=`hsl(${hue},85%,60%)`,shade=`hsl(${hue},75%,36%)`,highlight=`hsl(${alt},85%,65%)`;
 const grad=`<defs><linearGradient id="g${code}" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#ffffff"/><stop offset=".13" stop-color="${accent}"/><stop offset=".55" stop-color="${shade}"/><stop offset="1" stop-color="#142333"/></linearGradient><linearGradient id="bg${code}" x2="0" y2="1"><stop stop-color="#173c55"/><stop offset="1" stop-color="#07131f"/></linearGradient><filter id="shadow${code}" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity=".55"/></filter></defs>`;
 const paint=`url(#g${code})`;
 let art='';
 if(cat.startsWith('Veículos')){
  const suv=/suv|blindado|picape/.test(id),bike=/bike|moto/.test(id),supercar=/super|hiper|esportivo|italiano|cupe/.test(id);
  if(bike){art=`<circle cx="33" cy="89" r="18" fill="#101b29" stroke="#d8e5ee" stroke-width="5"/><circle cx="128" cy="89" r="18" fill="#101b29" stroke="#d8e5ee" stroke-width="5"/><path d="M33 89 62 53 89 89 33 89 62 53 98 53 128 89" fill="none" stroke="${paint}" stroke-width="7" stroke-linejoin="round"/><path d="M96 49 113 40 127 47 M55 48 45 43" stroke="${highlight}" stroke-width="5" fill="none"/>`}
  else{const roof=suv?'M35 62 49 37 H117 L138 62':supercar?'M38 69 67 48 H118 L143 69':'M37 67 57 43 H110 L132 67';art=`<path d="${roof} H151 Q159 69 159 80 V95 H18 V80 Q18 67 37 67Z" fill="${paint}" stroke="#0b1323" stroke-width="3"/><path d="M54 64 65 48 H108 L124 64Z" fill="#a7d9ef" opacity=".82"/><circle cx="48" cy="95" r="15" fill="#111a29" stroke="#d9e3ef" stroke-width="5"/><circle cx="131" cy="95" r="15" fill="#111a29" stroke="#d9e3ef" stroke-width="5"/><path d="M25 74 H47 M141 74 H154" stroke="${highlight}" stroke-width="6"/>`}}
 else if(cat==='Pets'){
  const ears=/rabbit/.test(id)?'<path d="M63 48 59 9 Q68 -1 78 45 M105 46 119 9 Q129 7 116 53" fill="'+accent+'" stroke="#fff" stroke-width="3"/>':/cat/.test(id)?'<path d="M48 54 44 20 77 40 M99 40 128 20 126 59" fill="'+accent+'"/>':'<ellipse cx="51" cy="57" rx="16" ry="27" fill="'+shade+'"/><ellipse cx="129" cy="57" rx="16" ry="27" fill="'+shade+'"/>';
  art=`${ears}<ellipse cx="89" cy="72" rx="45" ry="42" fill="${paint}"/><ellipse cx="74" cy="69" rx="5" ry="7" fill="#19212e"/><ellipse cx="106" cy="69" rx="5" ry="7" fill="#19212e"/><path d="M82 87 Q89 93 96 87" stroke="#18222f" stroke-width="3" fill="none"/><ellipse cx="89" cy="82" rx="8" ry="5" fill="#1b2533"/>`;
  if(/bird/.test(id))art=`<ellipse cx="89" cy="70" rx="35" ry="40" fill="${paint}"/><circle cx="100" cy="60" r="5"/><path d="M110 70 133 78 109 84" fill="#ffb547"/><path d="M66 36 54 15 M77 34 74 13" stroke="${highlight}" stroke-width="6"/><path d="M73 82 Q87 99 101 80" stroke="${shade}" stroke-width="6" fill="none"/>`;
  if(/hamster/.test(id))art+=`<circle cx="54" cy="48" r="15" fill="${highlight}"/><circle cx="124" cy="48" r="15" fill="${highlight}"/>`;
 }
 else if(cat==='Imóveis')art=`<path d="M25 64 89 15 153 64" fill="none" stroke="${highlight}" stroke-width="12" stroke-linejoin="round"/><path d="M38 60 H140 V114 H38Z" fill="${paint}"/><rect x="79" y="80" width="24" height="34" rx="3" fill="#15283d"/><rect x="48" y="73" width="21" height="19" fill="#b4e6f9"/><rect x="112" y="73" width="19" height="19" fill="#b4e6f9"/>`;
 else if(cat==='Roupas')art=/sneaker/.test(id)?`<path d="M24 85 51 52 87 67 102 83 149 86 Q162 89 158 101 H24Z" fill="${paint}" stroke="#e4effa" stroke-width="4"/><path d="M40 93 H152" stroke="${highlight}" stroke-width="5"/>`:`<path d="M56 30 72 23 89 34 106 23 124 31 151 62 131 80 116 68 V112 H61 V68 L45 80 26 62Z" fill="${paint}" stroke="#cdd9ea" stroke-width="3"/><path d="M74 28 Q89 49 105 28" fill="none" stroke="${highlight}" stroke-width="5"/>`;
 else if(cat==='Saúde')art=`<rect x="43" y="28" width="94" height="86" rx="18" fill="${paint}"/><rect x="72" y="13" width="36" height="22" rx="6" fill="${highlight}"/><path d="M90 51 V93 M69 72 H111" stroke="white" stroke-width="13" stroke-linecap="round"/>`;
 else if(cat==='Acessórios'||cat==='Luxo'){
  if(/watch|relogio/.test(id))art=`<rect x="72" y="8" width="35" height="110" rx="9" fill="${shade}"/><rect x="51" y="37" width="77" height="62" rx="16" fill="${paint}" stroke="${highlight}" stroke-width="5"/><circle cx="89" cy="68" r="22" fill="#13263b"/><path d="M89 68 89 52 M89 68 103 74" stroke="white" stroke-width="3"/>`;
  else if(/glasses|oculos/.test(id))art=`<path d="M17 61 Q37 50 66 61 L71 79 Q53 104 29 86Z M108 61 Q137 50 158 61 L150 86 Q122 104 105 79Z" fill="${paint}" stroke="${highlight}" stroke-width="5"/><path d="M68 65 Q89 55 108 65" stroke="${highlight}" stroke-width="5" fill="none"/>`;
  else art=`<path d="M89 19 103 51 138 56 113 80 120 112 89 96 58 112 65 80 40 56 75 51Z" fill="${paint}" stroke="${highlight}" stroke-width="5"/><circle cx="89" cy="73" r="13" fill="white" opacity=".7"/>`;
 }
 else art=`<circle cx="89" cy="69" r="44" fill="${paint}"/><path d="M65 69 H113 M89 45 V93" stroke="${highlight}" stroke-width="10"/>`;
 return `<svg class="product-art-image" viewBox="0 0 178 125" role="img" aria-label="Ilustração exclusiva do item ${id}" xmlns="http://www.w3.org/2000/svg">${grad}<rect width="178" height="125" rx="11" fill="url(#bg${code})"/><path d="M0 100 Q89 91 178 100 V125 H0Z" fill="#12372e" opacity=".65"/><ellipse cx="89" cy="115" rx="69" ry="6" fill="#000" opacity=".5"/><g filter="url(#shadow${code})">${art}</g><path d="M${22+code%40} 25 L${34+code%40} 20" stroke="#fff" opacity=".28" stroke-width="2"/><circle cx="152" cy="18" r="7" fill="${highlight}"/></svg>`;
}

// Premiações: estatísticas por competição e adversários simulados persistentes.
function awardsInit(){if(!s.awardsSeason||s.awardsSeason.season!==s.season){s.awardsSeason={season:s.season,league:{A:{},B:{}},cup:{},supercup:{},player:{A:{games:0,goals:0,assists:0,rating:0},B:{games:0,goals:0,assists:0,rating:0},cup:{games:0,goals:0,assists:0,rating:0},supercup:{games:0,goals:0,assists:0,rating:0}}};}s.awardsHistory??=[];s.awardsSeason.europe??={};for(const key of Object.keys(EURO_LEAGUES)){s.awardsSeason.europe[key]??={};s.awardsSeason.player[key]??={games:0,goals:0,assists:0,rating:0}}for(const country of Object.keys(EURO_CUPS)){for(const suffix of ["cup","super"]){const key=country+suffix;s.awardsSeason.europe[key]??={};s.awardsSeason.player[key]??={games:0,goals:0,assists:0,rating:0}}}return s.awardsSeason}
function awardsNpc(comp,club){const a=awardsInit(),pool=comp==='A'||comp==='B'?a.league[comp]:(comp==='cup'||comp==='supercup'?a[comp]:(a.europe[comp]||(a.europe[comp]={})));if(!pool[club])pool[club]={name:['Camisa 9','Meia 10','Atacante','Artilheiro','Craque'][Math.abs([...club].reduce((x,c)=>x+c.charCodeAt(0),0))%5]+' do '+club,club,goals:0,games:0,assists:0,rating:0,age:19+Math.abs([...club].reduce((x,c)=>x+c.charCodeAt(0),0))%15};return pool[club]}
function awardsNpcMatch(comp,club,teamGoals){const p=awardsNpc(comp,club);p.games++;const scored=Math.min(teamGoals,Math.random()<.57?1:Math.random()<.55?2:0);p.goals+=scored;p.assists+=Math.random()<.21?1:0;p.rating+=5.8+scored*1.7+(Math.random()*1.9);}
function awardsPlayerMatch(f,goals,assists,active){const a=awardsInit(),key=f.type==='league'?(europeanClub(s.club)?europeanLeagueKey(s.club):s.division):f.type==='eurocup'?EURO_CLUBS[s.club].country+'cup':f.type==='cup'?'cup':'supercup',p=a.player[key];if(active){p.games++;p.goals+=goals;p.assists+=assists?1:0;p.rating+=6+goals*1.9+(assists?1.1:0)+(s.squadRole==='Titular'?.5:0);}}
function awardsCandidates(comp){const a=awardsInit(),pool=comp==='A'||comp==='B'?a.league[comp]:(comp==='cup'||comp==='supercup'?a[comp]:(a.europe[comp]||(a.europe[comp]={})));const out=Object.values(pool);const p=a.player[comp];if((comp==='A'||comp==='B'?(!europeanClub(s.club)&&s.division===comp):EURO_LEAGUES[comp]?europeanClub(s.club)&&europeanLeagueKey(s.club)===comp:comp.endsWith('cup')||comp.endsWith('super')?europeanClub(s.club)&&EURO_CLUBS[s.club].country===comp.slice(0,2):true)&&p.games)out.push({...p,name:s.player,club:s.club,age:s.age,isPlayer:true});return out}
function awardsBest(candidates){return [...candidates].sort((a,b)=>(b.rating/Math.max(1,b.games))-(a.rating/Math.max(1,a.games))||b.goals-a.goals)[0]||null}
function awardsFinish(){const a=awardsInit();if(s.awardsHistory.some(x=>x.season===s.season))return;const prizes=[];for(const div of ['A','B']){const candidates=awardsCandidates(div);const best=awardsBest(candidates);if(best)prizes.push({competition:'Brasileirão Série '+div,title:'Melhor Jogador',winners:[best]});const max=Math.max(0,...candidates.map(p=>p.goals));if(max>0)prizes.push({competition:'Brasileirão Série '+div,title:'Artilheiro',winners:candidates.filter(p=>p.goals===max)});if(div==='A'){const eligible=candidates.filter(p=>p.age<=21);const revelation=awardsBest(eligible);if(revelation)prizes.push({competition:'Brasileirão Série A',title:'Revelação (até 21 anos)',winners:[revelation]});}}
const cup=ensureCup();if(cup.finished){const best=awardsBest(awardsCandidates('cup'));if(best)prizes.push({competition:'Copa do Brasil',title:'Melhor Jogador da Copa',winners:[best]});}if(cup.supercup?.done){const best=awardsBest(awardsCandidates('supercup'));if(best)prizes.push({competition:'Supercopa do Brasil',title:'Melhor Jogador da Copa',winners:[best]});}
for(const [key,info] of Object.entries(EURO_LEAGUES)){const candidates=awardsCandidates(key);const best=awardsBest(candidates);if(best)prizes.push({competition:info.name+" · "+COUNTRY_NAMES[key.slice(0,2)],title:"Melhor Jogador",winners:[best]});const max=Math.max(0,...candidates.map(p=>p.goals));if(max>0)prizes.push({competition:info.name+" · "+COUNTRY_NAMES[key.slice(0,2)],title:"Artilheiro",winners:candidates.filter(p=>p.goals===max)});if(key.endsWith("A")){const eligible=candidates.filter(p=>p.age<=21);const revelation=awardsBest(eligible);if(revelation)prizes.push({competition:info.name+" · "+COUNTRY_NAMES[key.slice(0,2)],title:"Revelação (até 21 anos)",winners:[revelation]});}}
const ew=euroWorldInit();for(const [country,meta] of Object.entries(EURO_CUPS)){const cup=ew.cups[country];for(const [suffix,done,title] of [["cup",!!cup.champion,meta.copa.name],["super",!!cup.superChampion,meta.supercopa.name]]){if(!done)continue;const best=awardsBest(awardsCandidates(country+suffix));if(best)prizes.push({competition:title,title:"Melhor Jogador da Copa",winners:[best]});}}
// Prêmios mundiais: avaliação por jogo, produção ofensiva e peso da competição.
const worldwide=[];
const worldLeagueKeys=['A','B',...Object.keys(EURO_LEAGUES)];
for(const key of worldLeagueKeys){
 const league=awardsCandidates(key);
 const elite=key==='A'||key.endsWith('A');
 for(const candidate of league){
  if(!candidate.games)continue;
  const found=worldwide.find(x=>x.isPlayer===!!candidate.isPlayer&&x.club===candidate.club&&x.name===candidate.name);
  const weight=elite?1.15:1;
  if(found){found.games+=candidate.games;found.goals+=candidate.goals;found.assists+=candidate.assists;found.rating+=candidate.rating*weight;}
  else worldwide.push({...candidate,rating:candidate.rating*weight});
 }
}
// Chuteira de Ouro Mundial: soma gols de todas as ligas e copas que possuem
// estatísticas individuais registradas, sem limite de idade nem mínimo de gols.
// Um atleta que disputa várias competições aparece uma única vez no ranking.
const goldenBootPlayers=worldwide.map(p=>({...p}));
const goldenCupKeys=['cup','supercup',...Object.keys(EURO_CUPS).flatMap(country=>[country+'cup',country+'super'])];
for(const key of goldenCupKeys){
 for(const candidate of awardsCandidates(key)){
  if(!candidate.games)continue;
  const found=goldenBootPlayers.find(p=>p.isPlayer===!!candidate.isPlayer&&p.name===candidate.name&&p.club===candidate.club);
  if(found){found.goals+=candidate.goals;found.games+=candidate.games;}
  else goldenBootPlayers.push({...candidate});
 }
}
const goldenMax=Math.max(0,...goldenBootPlayers.map(p=>p.goals));
if(goldenMax>0){
 const goldenWinners=goldenBootPlayers.filter(p=>p.goals===goldenMax);
 prizes.push({competition:'Premiações Mundiais',title:'Chuteira de Ouro Mundial',winners:goldenWinners});
}
const worldScore=p=>p.rating/Math.max(1,p.games)+Math.min(3,p.goals/Math.max(1,p.games)*1.8)+Math.min(1.5,p.assists/Math.max(1,p.games)*.8)+Math.min(1.5,p.games/25);
const worldEligible=worldwide.filter(p=>p.games>=3);
const worldWinner=[...worldEligible].sort((a,b)=>worldScore(b)-worldScore(a))[0];
if(worldWinner)prizes.push({competition:'Premiações Mundiais',title:'Melhor Jogador do Mundo',winners:[worldWinner]});
const youngWorld=[...worldEligible].filter(p=>p.age<=21).sort((a,b)=>worldScore(b)-worldScore(a));
if(youngWorld.length)prizes.push({competition:'Premiações Mundiais',title:'Revelação Mundial (até 21 anos)',winners:[youngWorld[0]]});
s.awardsHistory.unshift({season:s.season,age:s.age,prizes});const mine=prizes.filter(p=>p.winners.some(w=>w.isPlayer));if(mine.length)for(const prize of mine){socialAchievement(`🏆 Conquistei ${prize.title} — ${prize.competition}! Obrigado a todos pelo apoio!`,Math.max(250,Math.round(s.followers*.06)));}for(const p of mine)addMedia('🏅 '+s.player+' conquista '+p.title+'!',`Premiação da ${p.competition}: ${s.player} recebe o troféu de ${p.title}.`,'Craque',s.club,true);addMedia('🏆 Premiação da temporada '+s.season,prizes.map(p=>p.competition+' — '+p.title+': '+p.winners.map(w=>w.name).join(' e ')).join(' • '),'Brasileirão',s.club,true);}
function awardsScreen(){awardsInit();const h=s.awardsHistory||[];const a=s.awardsSeason;const rows=h.map(year=>`<div class="choice"><h3>🏆 Temporada ${year.season}</h3>${year.prizes.map(p=>`<p><b>${esc(p.competition)} · ${esc(p.title)}</b><br>${p.winners.map(w=>`${w.isPlayer?'⭐ ':''}${esc(w.name)} (${esc(w.club)})${(p.title==='Artilheiro'||p.title==='Chuteira de Ouro Mundial')?' — '+w.goals+' gols':''}`).join(' • ')}</p>`).join('')}</div>`).join('');const mine=h.flatMap(y=>y.prizes.filter(p=>p.winners.some(w=>w.isPlayer)).map(p=>({year:y.season,...p})));const globalMine=s.globalTitles||[];return `<section class="card"><h2>🏅 Premiações e Sala de Troféus</h2><p>Prêmios entregues ao final de cada temporada. Os outros jogadores também disputam os títulos.</p><p class="hint">🌍 Melhor Jogador do Mundo: avaliação e desempenho nas ligas. 🌟 Revelação Mundial: os mesmos critérios, somente atletas com até 21 anos. Mínimo de 3 partidas na temporada. 🥾 Chuteira de Ouro Mundial: maior número de gols somados nas ligas e copas com estatísticas individuais, sem mínimo de gols; empates dividem o prêmio.</p><div class="stats"><div class="stat"><strong>${mine.length+globalMine.length}</strong>Seus prêmios</div><div class="stat"><strong>${s.season}</strong>Temporada</div></div><h3>🌎 Títulos continentais e mundiais</h3>${globalMine.length?globalMine.map(p=>`<div class="item"><b>🏆 ${esc(p.competition)}</b><small>Temporada ${p.season}</small></div>`).join(''):'<p class="muted">Ainda não conquistou títulos continentais.</p>'}<h3>⭐ Seus troféus</h3>${mine.length?mine.map(p=>`<div class="item"><div><b>🏆 ${esc(p.title)}</b><small>${esc(p.competition)} • Temporada ${p.year}</small></div></div>`).join(''):'<p class="muted">Ainda não ganhou premiações individuais.</p>'}<h3>📊 Sua temporada atual</h3>${[['A','Série A'],['B','Série B'],['cup','Copa do Brasil'],['supercup','Supercopa'],...Object.entries(EURO_LEAGUES).map(([k,v])=>[k,v.name+' · '+COUNTRY_NAMES[k.slice(0,2)]]),...Object.entries(EURO_CUPS).flatMap(([k,v])=>[[k+'cup',v.copa.name],[k+'super',v.supercopa.name]])].filter(([k])=>["A","B","cup","supercup"].includes(k)||a.player[k].games>0).map(([k,label])=>`<p>${label}: <b>${a.player[k].goals} gols</b> • ${a.player[k].games} jogos • ${a.player[k].assists} assistências</p>`).join('')}<h3>📜 Premiações anteriores</h3>${rows||'<p class="muted">Os vencedores serão anunciados no fim da temporada.</p>'}</section>`}
function schedule(){const others=Object.keys(s.table).filter(x=>x!==s.club);return others[(s.round-1)%others.length]}
function strength(){return s.skills.shoot*0.025+s.skills.speed*0.012+s.skills.dribble*0.013+s.skills.fitness*0.006+(activeBoot()?(bootById(activeBoot().id)?.[4]||0):0)+(s.sponsor===0?.03:0)}
function updateTeam(name,gf,ga){const t=s.table[name];t.p+=gf>ga?3:gf===ga?1:0;t.w+=gf>ga?1:0;t.d+=gf===ga?1:0;t.l+=gf<ga?1:0;t.gf+=gf;t.ga+=ga}
